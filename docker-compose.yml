services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: duragent
      POSTGRES_PASSWORD: duragent
      POSTGRES_DB: duragent
    ports:
      - "5432:5432"
    volumes:
      - duragent-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duragent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  duragent-pg:
